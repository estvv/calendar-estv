# Rate-limit zones keyed on the forwarded client IP: this container is only
# reachable through Caddy, which sets X-Forwarded-For.
limit_req_zone   $http_x_forwarded_for  zone=api:10m    rate=120r/m;
limit_req_zone   $http_x_forwarded_for  zone=assets:10m rate=240r/m;
limit_conn_zone  $http_x_forwarded_for  zone=conns:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout 15s;

    limit_conn conns 20;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=assets burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        limit_req zone=assets burst=120 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://calendar-backend-estv:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # Health checks bypass the rate limiter.
    location = /health {
        proxy_pass http://calendar-backend-estv:8080;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
